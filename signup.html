<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Montra</title>
    <meta name="description" content="Create your Montra account and start managing your expenses with ease.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <main class="signup-page">

    
        <a href="home.html" class="logo">
            <img src="montra.jpg" alt="Montra logo">
            <span>Montra</span>
        </a>

     
        <section class="signup-card">

            <div class="signup-heading">
                <h1>Create your account</h1>
                <p>Start taking control of your expenses with Montra.</p>
            </div>

            <form id="signupForm">

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="password"
                            aria-label="Show password"
                        >
                            Show
                        </button>
                    </div>

                    <small>Use at least 8 characters.</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirmPassword"
                            aria-label="Show password"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <label class="terms">
                    <input type="checkbox" id="terms" name="terms" required>
                    <span>
                        I agree to the
                        <a href="terms.html">Terms and Conditions</a>
                        and
                        <a href="privacy.html">Privacy Policy</a>.
                    </span>
                </label>

                <button type="submit" class="signup-button">
                    Create Account
                    <span aria-hidden="true">→</span>
                </button>

                <p class="form-message" id="formMessage" role="status"></p>

            </form>

            <div class="login-prompt">
                <p>Already have an account?</p>
                <a href="login.html">Log in</a>
            </div>

        </section>

        <p class="signup-footer">
            &copy; 2026 Montra. All rights reserved.
        </p>

    </main>

    <script src="signUp.js"></script>
</body>
</html>
