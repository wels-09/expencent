<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In | Montra</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="login.css">
</head>
<body>

    <main class="login-page">

        <!-- Logo -->
        <a href="index.html" class="logo">
            <img src="montra.jpg" alt="Montra logo">
            <span>Montra</span>
        </a>

        <section class="login-card">

            <div class="login-heading">
                <h1>Welcome back!</h1>
                <p>Log in to your Montra account to continue.</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>

                    <a href="forgot-password.html" class="forgot-password">
                        Forgot password?
                    </a>
                </div>

                <button type="submit" class="login-button">
                    Log In
                </button>

                <p class="form-message" id="formMessage" role="status"></p>

            </form>

            <div class="signup-prompt">
                <p>Don't have an account?</p>
                <a href="signup.html">Create an account</a>
            </div>

        </section>

        <p class="login-footer">
            &copy; 2026 Montra. All rights reserved.
        </p>

    </main>

</body>
</html>
